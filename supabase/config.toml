# Supabase CLI settings for Stoop. Only the parts that differ from the defaults.
project_id = "stoop"

[api]
schemas = ["public", "graphql_public", "rentals"]

# Apify calls ingest without a Supabase login; it checks x-webhook-secret instead.
[functions.ingest]
verify_jwt = false

# rescore checks the signed-in user itself (see its index.ts).
[functions.rescore]
verify_jwt = false

# enrich checks the signed-in user itself.
[functions.enrich]
verify_jwt = false

# commute checks the signed-in user itself.
[functions.commute]
verify_jwt = false
