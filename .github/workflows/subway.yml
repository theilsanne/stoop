# Builds the subway network Stoop uses for commute times (stations, rides between
# them, typical waits and transfers) from the MTA's published subway timetable.
# Runs on the 1st of each month and on demand; commits the result if it changed.
name: Update subway network
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Also push the raw timetable to the gtfs-snapshot branch (for development)"
        type: boolean
        default: false
  schedule:
    - cron: "17 9 1 * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Download the MTA subway timetable
        run: |
          curl -sSfL -o gtfs_subway.zip https://rrgtfsfeeds.s3.amazonaws.com/gtfs_subway.zip
          mkdir gtfs && unzip -q gtfs_subway.zip -d gtfs && ls -la gtfs
      - name: Snapshot the raw timetable to its own branch
        if: inputs.snapshot
        run: |
          mkdir /tmp/snap && cp gtfs_subway.zip /tmp/snap/ && cd /tmp/snap
          git init -q -b gtfs-snapshot && git add gtfs_subway.zip
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "MTA subway GTFS snapshot"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gtfs-snapshot
      - name: Build the network
        if: hashFiles('scripts/build-subway.mjs') != ''
        run: node scripts/build-subway.mjs gtfs supabase/functions/_shared/subway-graph.json
      - name: Commit if changed
        if: hashFiles('scripts/build-subway.mjs') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/subway-graph.json
          git diff --cached --quiet || git commit -m "Update subway network from MTA timetable" && git push
