name: Migrate

# Applies new migrations to the Stoop project when they land on main. The project's
# history table (supabase_migrations.schema_migrations) records which files have run,
# so each run applies only the files it doesn't list yet, in filename order.
# A pull request dry-runs its migrations so a bad one shows before merge.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", ".github/workflows/migrate.yml"]
  pull_request:
    paths: ["supabase/migrations/**", ".github/workflows/migrate.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, and never cancel one halfway through a migration.
concurrency:
  group: migrate
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: jjrjswxakuneoxipdswd
  SUPABASE_CLI_VERSION: 2.122.0

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Link the project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Dry-run the migrations
        run: supabase db push --linked --dry-run
      - name: Apply the migrations
        # a pull request only checks them; the merge to main applies them
        if: github.event_name != 'pull_request'
        run: supabase db push --linked
